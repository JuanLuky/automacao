version: "3.9"

networks:
  atendimento-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  n8n_data:

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — banco único, com 3 databases:
  # evolution_db (Evolution API), n8n_db (n8n) e
  # atendimento_db (o backend NestJS do seu MVP)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 no host — a porta 5432 já está ocupada por um PostgreSQL nativo
      # do Windows (serviço "postgresql-x64-13") nesta máquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - atendimento-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Redis — cache/sessão exigido pela Evolution API
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - atendimento-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Evolution API — conexão com o WhatsApp
  # ─────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      # Autenticação
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"

      # Server
      SERVER_URL: ${EVOLUTION_SERVER_URL}


      # Configuração da sessão do WhatsApp
      CONFIG_SESSION_PHONE_CLIENT: ChatGPT
      CONFIG_SESSION_PHONE_NAME: Chrome

      # Banco de dados
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution_db
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # Cache (Redis)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_api
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Webhook — configurado por instância no Manager (Events → Webhook),
      # apontando para http://n8n:5678/webhook/whatsapp. NÃO habilitar
      # WEBHOOK_GLOBAL_* junto com isso — causa mensagens duplicadas.
      WEBHOOK_GLOBAL_ENABLED: "false"

      # Logs
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - atendimento-network

  # ─────────────────────────────────────────────
  # n8n — orquestração de mensageria (menu, roteamento)
  # ─────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_SERVER_URL: ${EVOLUTION_SERVER_URL}

      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - atendimento-network

  # ─────────────────────────────────────────────
  # pgAdmin (opcional) — inspecionar os bancos visualmente
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - atendimento-network

  # ─────────────────────────────────────────────
  # Backend (NestJS) — dentro do container fala com postgres/evolution-api
  # pelos nomes dos serviços, não por localhost:5433/localhost:8089 (isso só
  # vale rodando nativo). Migrations continuam rodando nativas, via
  # npm run migration:run no backend/, contra a porta 5433 publicada.
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/atendimento_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      N8N_API_KEY: ${N8N_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 3000
      # Sem isso o container roda em UTC (não herda o fuso do host) — quebra
      # BusinessHoursService.estaAberto(), que assume new Date() já em hora
      # local (mesmo pressuposto do timestamptz, ver CLAUDE.md). Mesmo valor
      # do GENERIC_TIMEZONE do n8n acima.
      TZ: America/Sao_Paulo
    ports:
      # Publicado no host pra: (1) o frontend/browser acessar via localhost:3000,
      # (2) o n8n continuar chamando host.docker.internal:3000 sem nenhuma
      # mudança no workflow.
      - "3000:3000"
    volumes:
      # MediaStorageService grava em ./uploads/mensagens relativo ao cwd do
      # processo — bind mount preserva os arquivos entre rebuilds do container.
      - ./backend/uploads:/app/uploads
    networks:
      - atendimento-network

  # ─────────────────────────────────────────────
  # Frontend (Next.js) — NEXT_PUBLIC_* são embutidos no bundle em build-time,
  # mudar qualquer um exige rebuild (--build).
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_EVOLUTION_INSTANCE: ${NEXT_PUBLIC_EVOLUTION_INSTANCE}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - atendimento-network
