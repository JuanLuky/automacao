version: "3.9"

# App (backend + frontend) — separado da infra (docker-compose.yml).
# Depende da infra já estar rodando (rede + Postgres/Evolution/n8n/Redis) —
# suba com "docker compose -f docker-compose.yml -f docker-compose.app.yml up -d"
# a partir da raiz do repo, ou o docker-compose.yml sozinho primeiro e este
# em seguida. Migrations continuam rodando de fora do container (nativo,
# via npm run migration:run no backend/, contra a porta 5433 publicada pelo
# Postgres) — mesmo fluxo já documentado no CLAUDE.md, não muda com isso.

networks:
  atendimento-network:
    external: true
    name: automacao_atendimento-network

services:

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      # postgres/evolution-api são os nomes dos serviços na rede Docker da
      # infra — dentro do container o backend não usa mais localhost:5433
      # nem localhost:8089 (isso só existia porque ele rodava nativo, fora
      # do Docker).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/atendimento_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      PORT: 3000
      # Sem isso o container roda em UTC (não herda o fuso do host) — quebra
      # BusinessHoursService.estaAberto(), que assume new Date() já em hora
      # local (mesmo pressuposto do timestamptz, ver CLAUDE.md). Mesmo valor
      # do GENERIC_TIMEZONE do n8n em docker-compose.yml.
      TZ: America/Sao_Paulo
    ports:
      # Publicado no host pra: (1) o frontend/browser acessar via localhost:3000,
      # (2) o n8n continuar chamando host.docker.internal:3000 sem nenhuma
      # mudança no workflow.
      - "3000:3000"
    volumes:
      # MediaStorageService grava em ./uploads/mensagens relativo ao cwd do
      # processo — bind mount preserva os arquivos entre rebuilds do container.
      - ./backend/uploads:/app/uploads
    networks:
      - atendimento-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_EVOLUTION_INSTANCE: ${NEXT_PUBLIC_EVOLUTION_INSTANCE}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
